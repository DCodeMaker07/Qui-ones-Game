<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>NA-50 de Quiñones: vista previa en 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc6e8; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #info { position: fixed; left: 12px; bottom: 10px; font: 12px monospace; color: #fff; text-shadow: 0 0 3px #000; }
    #bajar { position: fixed; right: 12px; bottom: 10px; font: 13px sans-serif; padding: 6px 10px; cursor: pointer; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="info"></div>
  <button id="bajar">Descargar .glb</button>
  <script type="module">
    // Página de vista previa del avión 3D. Parámetros: ?vista=orbita|lado|arriba|frente|tres|vuelo  y  ?pixel=N (por ejemplo 3:
    // dibuja a una tercera parte de la resolución y lo estira sin suavizar, para que se vea pixelado como el juego).
    import * as THREE from 'three';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { crearAvionNA50 } from '/src/sistemas/three/avionNA50.js';

    const params = new URLSearchParams(location.search);
    const vista = params.get('vista') ?? 'orbita';
    const pixel = Number(params.get('pixel') ?? 1);

    const renderer = new THREE.WebGLRenderer({ antialias: pixel === 1 });
    renderer.setPixelRatio(1 / pixel);
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const escena = new THREE.Scene();
    escena.background = new THREE.Color(0xa9cfee);
    escena.fog = new THREE.Fog(0xa9cfee, 40, 120);
    escena.add(new THREE.HemisphereLight(0xffffff, 0x8a6a40, 1.1));
    const sol = new THREE.DirectionalLight(0xfff0d0, 2.4);
    sol.position.set(6, 10, 4);
    escena.add(sol);

    // El suelo es el mismo terreno del Nivel 1, repetido y sin suavizar
    const textura = new THREE.TextureLoader().load('/assets/fondos/terreno_zarumilla.png');
    textura.wrapS = textura.wrapT = THREE.RepeatWrapping;
    textura.repeat.set(30, 30);
    textura.magFilter = THREE.NearestFilter;
    textura.colorSpace = THREE.SRGBColorSpace;
    const suelo = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshStandardMaterial({ map: textura }));
    suelo.rotation.x = -Math.PI / 2;
    suelo.position.y = vista === 'vuelo' ? -9 : -3.2;
    escena.add(suelo);

    const { avion, actualizar, inclinar } = crearAvionNA50(THREE);
    escena.add(avion);

    const camara = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);
    const fijas = { lado: [13, 0.8, 0], arriba: [0.001, 14, 0.001], frente: [0, 1.5, 13], tres: [8.5, 3.6, 8.5] };
    if (fijas[vista]) camara.position.set(...fijas[vista]);
    camara.lookAt(0, 0, 0);

    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      camara.aspect = innerWidth / innerHeight;
      camara.updateProjectionMatrix();
    });

    document.getElementById('bajar').onclick = () => {
      new GLTFExporter().parse(avion, (glb) => {
        const enlace = document.createElement('a');
        enlace.href = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
        enlace.download = 'na50_quinones.glb';
        enlace.click();
      }, console.error, { binary: true });
    };
    document.getElementById('info').textContent = `vista=${vista}  pixel=${pixel}`;

    let t = 0;
    let anterior = performance.now();
    renderer.setAnimationLoop(() => {
      const ahora = performance.now();
      const dt = Math.min(0.05, (ahora - anterior) / 1000);
      anterior = ahora;
      t += dt;
      actualizar(dt);
      if (vista === 'orbita') {
        camara.position.set(Math.cos(t * 0.5) * 12, 3 + Math.sin(t * 0.3) * 1.5, Math.sin(t * 0.5) * 12);
        camara.lookAt(0, 0, 0);
      } else if (vista === 'vuelo') {
        // La cámara va detrás y un poco arriba; el avión se mece y el suelo viene hacia nosotros
        inclinar(Math.sin(t * 0.9) * 0.25, 0.06 + Math.sin(t * 0.6) * 0.03);
        avion.position.y = Math.sin(t * 1.3) * 0.25;
        textura.offset.y -= dt * 0.35;
        camara.position.set(0, 2.6, -11);
        camara.lookAt(0, 0.3, 3);
      }
      renderer.render(escena, camara);
    });
  </script>
</body>
</html>
