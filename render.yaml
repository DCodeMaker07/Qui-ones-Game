services:
  - type: web
    name: quinones-juego
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_WS_URL
        sync: false

  - type: web
    name: quinones-servidor
    runtime: node
    rootDir: server
    plan: free
    buildCommand: echo "sin dependencias"
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: ORIGENES_PERMITIDOS
        sync: false
